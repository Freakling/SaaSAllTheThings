; SaaSAllTheThings screen capture settings · project-owned: edit freely.
; Read by tools/ui/*.mjs (bash tools/ui_capture.sh). Lists are space-separated, as in check.cfg.
; Comments on their own lines.

[sizes]
; Viewport sizes, WxH. The first is the default size, used for starter drawings and verify.
list = 1920x1080 2560x1080 1280x720

[capture]
; Math.random is seeded with this in every page, so captures repeat.
seed = 12345
; Animation frames to wait, after the screen loads and the network is idle, before the screenshot.
settle_frames = 6
; At most this many elements in an element map.
max_elements = 200
; Seconds a screen's state may take; one that doesn't finish fails that screen only.
setup_timeout = 60
; Screen ids never captured, and screen files deliberately not in the catalog (a path, or a file
; name without its extension), for bash tools/ui_capture.sh --missing.
skip =

[web]
; The web client running on this machine that capture opens, such as http://localhost:5173, with
; the backend on the local Functions host and emulators.
; Empty: no web client, so capture isn't available yet (native Windows and mobile clients come
; later); list, process and verify's check of the spec's names still work.
base_url =
; The dev environment's web client, such as https://orderdesk-dev.azurestaticapps.net, captured with
; bash tools/ui_capture.sh --dev. Its host is the one hosted address capture opens, with seeded test
; tenants and saved test sign-ins only; its API must answer on the same host, since requests to
; any other host are blocked. Never prod: capture refuses every other hosted address, and Azure's
; always. Empty: capture opens this machine only.
dev_url =
; Where states send their api requests, when it isn't base_url (the local Functions host, such as
; http://localhost:7071).
api_url =
; Other names for this machine, besides localhost, 127.0.0.1 and [::1], such as a container's host
; name. Each must resolve to a loopback or private address, or capture refuses it; the dev
; environment goes in dev_url, never here.
allow_hosts =
; The seeded test tenants, space-separated, on this machine and in dev. A catalog entry or state
; that names a tenant names one of these, and opens signed in as its test user; never a real tenant
; or account.
tenants =
; A command that starts the app when nothing answers at ready_url (default base_url); capture
; stops it afterwards. Empty: start the app yourself first.
start_command =
ready_url =
start_timeout = 120

[lint]
; squeezed-text: wrapping text narrower than this many average characters.
min_label_chars = 6
; stretched-control: a button taller than this many times its content height (plus padding and border).
max_button_height_ratio = 2.0
; The web lint runs in capture and verify, not in bash tools/check.sh: it needs a browser and a
; running app, and the check needs neither.

[verify]
; bash tools/ui_capture.sh <screen> --verify: how far, in percent of the screen per edge, a built
; element may sit from the spec's Where before it is reported.
tolerance_pct = 4.0
