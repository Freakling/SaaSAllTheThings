; SaaSAllTheThings check settings · project-owned: onboarding fills it in; edit freely.
; Read by tools/check.sh and tools/archcheck.awk. Paths are relative to the repository root, lists
; are space-separated, and comments go on their own lines.
; The rules, and which layer may depend on which, are framework-owned
; (.satt/reference/layers.md). Only an accepted ADR in adr/ excuses a violation.

[project]
; The backend stack: tools/stacks/<stack>.sh runs its build and tests.
; dotnet · typescript · python · none (builds and tests only from tools/check.local.sh)
stack = dotnet
; What the stack builds, e.g. a .sln or .slnx for dotnet. Empty: found at the repository root.
target =

[tests]
; The check has a full tier (bash tools/check.sh: every step over the whole project) and a fast tier
; (--fast: the architecture rules and the secrets scan over the whole project, then only the steps the
; change from HEAD touches), both described in .satt/rules.md › Running the check.
; Seconds each test command may run in the fast tier, and in the full tier, before the check stops it and
; exits 3 (needs GNU timeout; CHECK_TIMEOUT overrides both). A command that runs past five minutes lets the
; prompt cache expire, so keep these modest. The defaults are 300 and 600 (the older key timeout counts as
; timeout-full when that isn't set).
timeout-fast = 300
timeout-full = 600
; Commits since the last full pass after which the full tier is due (bash tools/check.sh --due); 0: never
; by count. The default is 10.
full-every = 10
; Paths whose change makes --fast run as the full tier, besides the dependencies, lockfiles and toolchain
; settings of the stack and everything under tools/, which always do. Bash case patterns from the
; repository root, space-separated; one that ends in / is a folder. Empty by default; for example
; src/*/Migrations/ db/
full-when =
; on: the backend stack, the Bicep compile and tools/check.local.sh run side by side, each under its own
; limit, and their lines are printed in order. off (or no line): one after the other. Turn it off when
; tools/check.local.sh needs the backend's build output (it would start before the build is done).
parallel = on

[layers]
; layer = path patterns. A file belongs to the first layer, in this order, with a matching pattern;
; * stays within one folder name, ** crosses folders. Defaults for each stack are in
; .satt/reference/stacks.md › Profiles and their layouts. Files outside every layer are counted,
; not checked.
host = src/*.Functions
platform = src/*.Platform
integration = src/*.Integrations.*
contracts = src/*.Contracts
domain = src/*.Domain
application = src/*.Application
infrastructure = src/*.Infrastructure
client = clients/*
tests = tests/*

[imports]
; layer = the names other code imports it by: namespaces (.NET), packages (TypeScript) or modules
; (Python). An import matches a name that it equals, or starts with followed by . / or :.
contracts = {{APP}}.Contracts
domain = {{APP}}.Domain
application = {{APP}}.Application
infrastructure = {{APP}}.Infrastructure
integration = {{APP}}.Integrations

[limits]
; Many small files: source files longer than these fail the check.
max_lines = 300
host_max_lines = 80

[rules]
; Check rules a project switches. Absent or off: the rule doesn't run.
; network-public: Bicep for Service Bus, Cosmos DB, Key Vault and Storage must disable public network
; access and local authentication (.satt/reference/network.md). on | off
network-public = on


[security]
; Items done between security assessments: /next-task proposes .satt/procedures/security.md once this
; many items are done since the last report in assessment/security/. A whole number above 0; absent: 10.
every = 10

[stories]
; Items done between validations of the user stories in product/user-stories.md: /next-task proposes one
; (.satt/procedures/design.md › Validate the stories) once this many items are done since the file's
; Last validated commit (bash tools/stories.sh --due). A whole number above 0; absent: 10.
every = 10

[scan]
; Paths the check never reads, on top of .gitignore: build output and generated code.
skip = **/bin **/obj **/node_modules **/dist **/.venv **/__pycache__ **/Migrations **/*.g.cs **/*.Designer.cs **/*.generated.*
