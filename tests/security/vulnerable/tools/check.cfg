; The security fixture's check settings (tests/security/README.md). Only the architecture rules run on it.
[project]
stack = dotnet
target = src/Shop.Functions/Shop.Functions.csproj

[layers]
host = src/*.Functions
application = src/*.Application
infrastructure = src/*.Infrastructure

[imports]
application = Shop.Application
infrastructure = Shop.Infrastructure

[rules]
network-public = on

[scan]
skip = **/bin **/obj **/node_modules
