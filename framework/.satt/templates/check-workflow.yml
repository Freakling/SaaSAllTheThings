# SaaSAllTheThings check workflow · template, copied once by onboarding (when the human says yes)
# to .github/workflows/check.yml, which the app then owns; edit freely.
#
# Why: the check runs on the developer's machine (pre-commit hook, stop hook) and its logs sit in the
# gitignored .satt/state/. This workflow runs the same `bash tools/check.sh` on every pull request and
# every push to main, and keeps its output as a build artifact, so a reviewer can find the result for a
# commit. A failing check (exit 1) and a check that couldn't run (exit 3) both fail the job.
#
# Two more jobs sit beside the check: dependency-review reviews the dependencies a pull request
# changes, and sbom exports the dependency graph as an SPDX document on each push to main. Both use
# GitHub's dependency graph, which covers what the repository's packages declare; infra.md says
# what they don't cover and that vulnerability response stays the customer's process.
#
# How long the artifact is kept is not set here: no retention-days, so the repository's or the
# organisation's setting (Settings > Actions > General) decides.
#
# Every action is pinned to a full commit SHA, with its version in a trailing comment: a tag can move,
# a commit can't. To update one, change the SHA and the comment together (Dependabot's github-actions
# updates do both).
name: check

on:
  pull_request:
  push:
    branches: [main]

# The job only reads the repository.
permissions:
  contents: read

jobs:
  check:
    # Change to a self-hosted runner label if the app builds on its own runners.
    runs-on: ubuntu-latest
    steps:
      # The check reads the working tree (git ls-files), so the default shallow clone is enough.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # --- Stack setup: keep the steps for the stack the app uses (tools/check.cfg > [project] stack)
      # and delete the rest. Each step runs only when the app has that stack's files. Change the
      # versions to the ones the app targets (the check needs the .NET SDK 8 or newer, Node.js 20
      # or newer). Extra tools a stack needs (a global tool, a browser) are installed here too.
      - name: Set up .NET
        if: ${{ hashFiles('**/*.sln', '**/*.slnx', '**/*.csproj') != '' }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js
        if: ${{ hashFiles('**/package.json') != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Set up Python
        if: ${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') != '' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # The Bicep CLI (compiles infra/*.bicep in the check) and the Azure CLI come with GitHub's
      # ubuntu runners. On a self-hosted runner, install the Bicep CLI, or the check skips infra/.

      # Restores the stack's dependencies, as in a new clone (the pre-commit hook is skipped). Exit 3
      # (a toolchain is missing) fails the job here, before the check.
      - name: Restore dependencies
        run: bash tools/setup-clone.sh --skip-hook

      # The check itself. Its output goes to check-output/check.txt and to the job log. pipefail makes
      # the step fail with the check's own exit code: 1 = failed, 3 = couldn't run.
      - name: Run the check
        run: |
          set -o pipefail
          mkdir -p check-output
          bash tools/check.sh 2>&1 | tee check-output/check.txt

      # Runs even when the check failed, since a failing run's logs are the ones a reviewer needs.
      # Copies the check's logs (.satt/state/) next to its output. Hidden folders aren't uploaded, hence
      # the copy. secrets.txt is left out: it holds the lines of any secret the scan matched, and an
      # artifact is readable by everyone who can read the repository's runs.
      - name: Collect the check's logs
        if: always()
        run: |
          mkdir -p check-output/state
          for f in .satt/state/*.log .satt/state/*.txt; do
            [ -f "$f" ] || continue
            case "$f" in */secrets.txt) continue ;; esac
            cp "$f" check-output/state/
          done

      # No retention-days: the repository or organisation setting decides how long it is kept.
      - name: Keep the check's output as an artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: check-${{ github.run_number }}-${{ github.run_attempt }}
          path: check-output/
          if-no-files-found: warn

  # Reviews the dependencies a pull request adds, changes or removes, against GitHub's advisory database.
  # It needs the dependency graph enabled on the repository: on by default for public repositories;
  # private repositories need GitHub Advanced Security, or the dependency graph switched on in the
  # repository's settings. Without it the job fails, so delete the job rather than leave it red.
  # It reads the pull request's diff through the API, so it needs no checkout and only contents: read.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # fail-on-severity: high is the app's choice. A pull request that adds a dependency with a high or
      # critical advisory fails; moderate and low are reported but don't stop the merge. Lower it to
      # moderate or low for a stricter gate. The job doesn't comment on the pull request, which would
      # need pull-requests: write; its result is the job's own check.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  # Exports the dependency graph as an SPDX document on each push to main, and keeps it as the artifact
  # sbom-<run number>-<attempt>. The workflow's trigger already limits pushes to main. The endpoint is
  # GET /repos/{owner}/{repo}/dependency-graph/sbom: it needs the dependency graph enabled (see
  # dependency-review) and contents: read, which the job's GITHUB_TOKEN has. It answers with the document
  # under an "sbom" key, which the step writes out and checks. It lists what the graph knows only.
  sbom:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Export the SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --jq '.sbom' > sbom.spdx.json
          # Fails the step when the answer isn't an SPDX document (for example, the graph is off).
          grep -q '"spdxVersion"' sbom.spdx.json

      # No retention-days, as for the check's artifact: the repository or organisation setting decides.
      - name: Keep the SBOM as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ github.run_number }}-${{ github.run_attempt }}
          path: sbom.spdx.json
